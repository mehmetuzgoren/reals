name: Verification tooling

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - verification/**
      - .github/workflows/verification.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - verification/**
      - .github/workflows/verification.yml

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Probe tooling and documentation links (not product acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test verification/*.test.mjs
      - run: node verification/check-docs.mjs
